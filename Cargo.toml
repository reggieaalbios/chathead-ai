[workspace]
members = ["crates/chathead-core", "crates/chathead-linux"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
futures-util = "0.3.33"
gtk = { package = "gtk4", version = "0.11" }
gtk4-layer-shell = "0.8"
keyring = "4.1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
