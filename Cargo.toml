[workspace]
members = ["crates/chathead-core", "crates/chathead-linux", "crates/chathead-voice"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
ashpd = { version = "0.13.13", default-features = false, features = ["file_chooser", "global_shortcuts", "tokio"] }
bzip2 = "0.6"
cpal = { version = "0.18.1", features = ["pipewire", "pulseaudio"] }
futures-util = "0.3.33"
gtk = { package = "gtk4", version = "0.11" }
gtk4-layer-shell = "0.8"
keyring = "4.1.6"
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rubato = "4.0"
sha2 = "0.10"
sherpa-onnx = "1.13.4"
thiserror = "2.0"
tar = "0.4"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
ureq = { version = "3.2", default-features = false, features = ["rustls"] }
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tempfile = "3.23"
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
